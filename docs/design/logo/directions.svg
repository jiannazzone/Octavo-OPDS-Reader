<rect width="1200" height="1530" fill="#FFFFFF"/>
<text x="40" y="52" font-size="28" font-weight="600" fill="#1C1C1E">Octavo logo: directions explored</text>
<text x="40" y="82" font-size="16" fill="#6B6B70">Brainstorm with Adam, 2026-11-01. Feel: bookish and warm, crafted and printerly. Rough sketches; the chosen icon is in renders/.</text>
<g font-size="14" fill="#3A3A3C">
<!-- row template: label at x=40, icons at x=300, 600, 900 (120px), captions under -->
<text x="40" y="170" font-size="17" font-weight="600" fill="#1C1C1E">1 · The folded sheet</text>
<text x="40" y="192" fill="#6B6B70">The name's own story: a</text>
<text x="40" y="210" fill="#6B6B70">sheet folded 3× = 8 leaves</text>
<use href="#s1a" x="300" y="120" width="120" height="120"/><text x="300" y="262">A · Imposed sheet</text><text x="300" y="280" fill="#8E8E93">Shortlisted, then dropped</text>
<use href="#s1b" x="600" y="120" width="120" height="120"/><text x="600" y="262">B · Three folds</text><text x="600" y="280" fill="#8E8E93">Shortlisted, then dropped</text>
<use href="#s1c" x="900" y="120" width="120" height="120"/><text x="900" y="262">C · The gathering</text><text x="900" y="280" fill="#8E8E93">Not kept</text>

<text x="40" y="400" font-size="17" font-weight="600" fill="#1C1C1E">2 · The open book</text>
<text x="40" y="422" fill="#6B6B70">The Duo's spread and book</text>
<text x="40" y="440" fill="#6B6B70">mode, without drawing the</text>
<text x="40" y="458" fill="#6B6B70">device (HIG: no Apple hardware)</text>
<use href="#s2a" x="300" y="350" width="120" height="120"/><text x="300" y="492">A · The spread</text><text x="300" y="510" fill="#8E8E93">Shortlisted, then dropped</text>
<use href="#s2b" x="600" y="350" width="120" height="120"/><text x="600" y="492">B · Book mode</text><text x="600" y="510" fill="#8E8E93">Not kept</text>
<use href="#s2c" x="900" y="350" width="120" height="120"/><text x="900" y="492">C · The page turn</text><text x="900" y="510" fill="#8E8E93">Not kept</text>

<text x="40" y="630" font-size="17" font-weight="600" fill="#1C1C1E">3 · Letterforms</text>
<text x="40" y="652" fill="#6B6B70">"8vo" is how bibliographers</text>
<text x="40" y="670" fill="#6B6B70">abbreviate octavo</text>
<use href="#s3a" x="300" y="580" width="120" height="120"/><text x="300" y="722">A · 8vo</text><text x="300" y="740" fill="#8E3A2E" font-weight="600">Chosen as the glyph</text>
<use href="#s3b" x="600" y="580" width="120" height="120"/><text x="600" y="722">B · The O, bookmarked</text><text x="600" y="740" fill="#8E8E93">Not kept</text>
<use href="#s3c" x="900" y="580" width="120" height="120"/><text x="900" y="722">C · Ribbon 8</text><text x="900" y="740" fill="#8E8E93">Not kept</text>

<text x="40" y="860" font-size="17" font-weight="600" fill="#1C1C1E">4 · Your own library</text>
<text x="40" y="882" fill="#6B6B70">Reading from your own</text>
<text x="40" y="900" fill="#6B6B70">server; OPDS is a catalogue</text>
<use href="#s4a" x="300" y="810" width="120" height="120"/><text x="300" y="952">A · The shelf</text><text x="300" y="970" fill="#8E8E93">Not kept (generic)</text>
<use href="#s4b" x="600" y="810" width="120" height="120"/><text x="600" y="952">B · Catalogue card</text><text x="600" y="970" fill="#8E8E93">Finalist, with 8vo (row 5)</text>
<use href="#s4c" x="900" y="810" width="120" height="120"/><text x="900" y="952">C · Bookplate</text><text x="900" y="970" fill="#8E8E93">Shortlisted, then dropped</text>

<text x="40" y="1090" font-size="17" font-weight="600" fill="#1C1C1E">5 · 8vo on a card</text>
<text x="40" y="1112" fill="#6B6B70">Full-bleed card read as a</text>
<text x="40" y="1130" fill="#6B6B70">notepad; tab and drawer</text>
<text x="40" y="1148" fill="#6B6B70">tried to say "catalogue"</text>
<use href="#s5d" x="300" y="1040" width="120" height="120"/><text x="300" y="1182">d · Icon is the card</text><text x="300" y="1200" fill="#8E8E93">Read as a notepad</text>
<use href="#s5d2" x="600" y="1040" width="120" height="120"/><text x="600" y="1182">d2 · Guide card</text><text x="600" y="1200" fill="#8E8E93">Not kept</text>
<use href="#s5d3" x="900" y="1040" width="120" height="120"/><text x="900" y="1182">d3 · In the drawer</text><text x="900" y="1200" fill="#8E8E93">Finalist</text>

<text x="40" y="1320" font-size="17" font-weight="600" fill="#1C1C1E">6 · The library book card</text>
<text x="40" y="1342" fill="#6B6B70">Adam's idea: the card in the</text>
<text x="40" y="1360" fill="#6B6B70">book's pocket, stamped with</text>
<text x="40" y="1378" fill="#6B6B70">every loan. Your turn is next</text>
<use href="#s6e1" x="300" y="1270" width="120" height="120"/><text x="300" y="1412">e1 · Card in its pocket</text><text x="300" y="1430" fill="#8E8E93">Finalist</text>
<use href="#s6e2" x="600" y="1270" width="120" height="120"/><text x="600" y="1412">e2 · Date-due card</text><text x="600" y="1430" fill="#8E8E93">Not kept</text>
<use href="#s6e3" x="900" y="1270" width="120" height="120"/><text x="900" y="1412">e3 · The pocket front</text><text x="900" y="1430" fill="#8E3A2E" font-weight="600">Chosen as the icon</text>
</g>
<text x="40" y="1500" font-size="13" fill="#8E8E93">Lettering in these sketches falls back to Georgia if EB Garamond (SIL OFL 1.1) isn't installed. The final art has the lettering as outlines.</text>
</svg>
